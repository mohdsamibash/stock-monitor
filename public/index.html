<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>iPhone 18 · Kuwait Stock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d1d1f'/><circle cx='50' cy='50' r='18' fill='%2334c759'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-title">iPhone 18</span>
        <span class="brand-sub">Kuwait stock · prices in KWD</span>
      </div>
      <div class="counter" id="counter"><span class="counter-num" id="counter-num">–</span><span class="counter-label" id="counter-label">of 160 in stock</span></div>
      <div class="meta">
        <span class="badge profile" id="profile-badge" title="Schedule profile">…</span>
        <span class="updated" id="updated">loading…</span>
      </div>
      <div class="actions">
        <button class="btn icon" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn primary" id="refresh">Refresh</button>
      </div>
    </div>
    <div class="filters" id="filters">
      <select id="f-retailer" aria-label="Retailer"><option value="">All retailers</option></select>
      <select id="f-model" aria-label="Model"><option value="">All models</option></select>
      <select id="f-color" aria-label="Colour"><option value="">All colours</option></select>
      <select id="f-capacity" aria-label="Capacity"><option value="">All capacities</option></select>
      <label class="check"><input type="checkbox" id="f-instock"><span>In stock only</span></label>
      <button class="btn link" id="f-clear" hidden>Clear</button>
    </div>
  </header>

  <main id="app" class="container">
    <div class="stale" id="stale" hidden>⚠ The monitor has not reported for a while. Data below may be outdated.</div>
    <div class="empty" id="empty">Loading stock data…</div>
    <div id="sections"></div>
    <section class="changes" id="changes"></section>
  </main>

  <footer class="footer">
    <span id="footer-note">Statuses come straight from each retailer's own catalogue feed. Nothing is guessed: unresolved variants show as Not listed.</span>
  </footer>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
